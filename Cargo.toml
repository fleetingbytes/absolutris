[workspace]

members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.86"
description = "A tetris clone with absolute movements"
repository = "https://github.com/fleetingbytes/absolutris/"
homepage = "https://crates.io/crates/absolutris/"
documentation = "https://docs.rs/absolutris/latest/absolutris"
license = "BSD-2-Clause"
keywords = ["tetris", "game"]
categories = ["games"]

[workspace.dependencies]
bevy = "0.15.3"
randomorg = "1.0.4"

[workspace.lints.rust]

[workspace.lints.clippy]
